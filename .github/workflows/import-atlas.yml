name: Import and publish approved Atlas package
on:
  push:
    branches: [main]
    paths:
      - Atlas_GitHub_GitHack_Ready.zip
      - source-upload.zip
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-release-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'hazelfjeld/ai-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the authorized repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - name: Verify and import the approved archive
        run: python3 release/import_release.py
      - name: Test application and collector logic
        working-directory: app
        run: npm test
      - name: Publish the validated static app
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete validated Atlas app and catalogs'
            git push origin HEAD:main
          fi
          SHA=$(git rev-parse HEAD)
          {
            echo '## Atlas package imported and tests passed'
            echo
            echo 'App: https://raw.githack.com/hazelfjeld/ai-atlas/main/index.html'
            echo "Pinned release: https://rawcdn.githack.com/hazelfjeld/ai-atlas/$SHA/index.html"
            echo
            echo 'Open the app to verify GitHack rendering. A confirmation screen or cache delay is possible.'
            echo 'Automatic AI safety collection is NOT active. This is a static snapshot.'
          } >> "$GITHUB_STEP_SUMMARY"
