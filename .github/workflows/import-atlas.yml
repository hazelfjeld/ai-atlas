name: Import and verify Atlas release
on:
  push:
    branches: [main]
    paths: ['release/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-release-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'hazelfjeld/ai-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the authorized repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - name: Verify and restore the release
        run: python3 release/import_release.py
      - name: Run application tests
        working-directory: app
        run: npm test
      - name: Publish the verified static app
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No app changes to publish.'
          else
            git commit -m 'Publish complete validated Atlas app and catalogs'
            git push origin HEAD:main
          fi
