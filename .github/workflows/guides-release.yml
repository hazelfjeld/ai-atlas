name: Build verified safety concept guides
on:
  push:
    branches: ['atlas-guides-*']
    paths: ['content/term-guides.json', 'tests/term-guide-quality.test.cjs', 'scripts/build_term_pages.py', '.github/workflows/guides-release.yml']
permissions:
  contents: write
concurrency:
  group: atlas-guides-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'hazelfjeld/ai-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exactly this feature revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate published pages and validate catalog, citations and game rules
        run: |
          python3 scripts/build_term_pages.py
          python3 scripts/build_seo.py
          python3 scripts/build_offline.py
          python3 scripts/validate_checkpoint.py
          node --test tests/*.test.cjs
      - name: Commit deterministic generated files to the isolated feature branch
        run: |
          git add terms technology publication.json downloads/Atlas_Demo_Offline.html index.html about.html demo.html robots.txt sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish source-reviewed AI safety concept guides'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Confirm generated outputs are byte-for-byte reproducible
        run: |
          python3 scripts/build_term_pages.py
          python3 scripts/build_seo.py
          python3 scripts/build_offline.py
          git diff --exit-code
      - name: Check actual public GitHack bytes for updated term routes
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, urllib.request, time
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base='https://rawcdn.githack.com/hazelfjeld/ai-atlas/'+sha+'/'
          files=['terms/MLD-1149-specification-gaming.html','terms/MLD-1039-reward-hacking.html',
                 'terms/MLD-0470-goodhart-s-law.html','terms/MLD-0469-goal-misgeneralization.html',
                 'terms/MLD-0280-deceptive-alignment.html','terms/MLD-1119-shutdown-avoidance.html',
                 'terms/MLD-0017-activation-based-monitoring.html',
                 'terms/MLD-0718-mechanistic-interpretability.html',
                 'terms/MLD-1002-red-teaming.html',
                 'terms/MLD-0041-agent-evaluation.html',
                 'terms/MLD-0146-capability-failure.html',
                 'terms/MLD-0142-calibration.html','terms/MLD-0198-conformal-prediction.html',
                 'terms/index.html','terms/manifest.json','publication.json']
          for name in files:
              expected=pathlib.Path(name).read_bytes()
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(base+name,headers={'User-Agent':'Atlas-guide-integrity/1.0'})
                      with urllib.request.urlopen(req,timeout=25) as response:
                          assert response.status == 200
                          assert response.read() == expected, 'GitHack content differs: '+name
                      print('VERIFIED',name,flush=True)
                      break
                  except Exception:
                      if attempt == 3: raise
                      time.sleep(3)
          print('Verified source commit',sha, 'with',len(files),'exact public paths; not a hosted-browser interaction test.')
          PY
